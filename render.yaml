services:
  - type: web
    name: ripple-video
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: RUNWAYML_API_SECRET
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: RUNWAY_SEEDANCE_ROUTER_CONFIG_ID
        value: ripple-seedance-2
      - key: RUNWAY_SEEDANCE2_WORKFLOW_ID
        value: fecc0662-a1e1-4941-b84a-76df0bde1e4f
      - key: RUNWAY_SEEDANCE25_WORKFLOW_ID
        value: 4af4fdf6-a371-4a73-b02d-fdbf116186d5
      - key: RUNWAY_HAILUO3_WORKFLOW_ID
        value: 55cd8a57-dd96-4401-b9d0-0ab506130f77
      - key: RUNWAY_PRODUCT_CLONE_WORKFLOW_ID
        value: 0b9a4bd0-27a2-4ef7-a2d3-ba1d89a8a0d0
      - key: RIPPLE_ACCESS_PASSWORD
        generateValue: true
      - key: RIPPLE_DATA_DIR
        value: /data/ripple
      - key: RIPPLE_CACHE_DIR
        value: /data/cache
      - key: RIPPLE_MAX_UPLOAD_MIB
        value: "256"
