services:
  - type: web
    name: ripple-video
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: RUNWAYML_API_SECRET
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: RUNWAY_SEEDANCE_ROUTER_CONFIG_ID
        sync: false
      - key: RUNWAY_SEEDANCE2_WORKFLOW_ID
        sync: false
      - key: RUNWAY_SEEDANCE25_WORKFLOW_ID
        sync: false
      - key: RUNWAY_HAILUO3_WORKFLOW_ID
        sync: false
      - key: RUNWAY_PRODUCT_CLONE_WORKFLOW_ID
        sync: false
      - key: RIPPLE_DATA_DIR
        value: /data/ripple
      - key: RIPPLE_CACHE_DIR
        value: /data/cache
      - key: RIPPLE_MAX_UPLOAD_MIB
        value: "256"
